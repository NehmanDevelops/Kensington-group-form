<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Customize — Kensington Corporate Go-Live</title>
<style>
  @font-face{font-family:'SangBleu Republic';src:url('fonts/SangBleuRepublic-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
  @font-face{font-family:'SangBleu Republic';src:url('fonts/SangBleuRepublic-Medium.ttf') format('truetype');font-weight:500;font-display:swap}
  @font-face{font-family:'SangBleu Sunrise';src:url('fonts/SangBleuSunrise-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
  :root { --ink:#3a2f3c; --soft:#524a54; --mute:#8b8678; --bone:#fdf9ec; --paper:#fffdf8; --cream:#f3eedf; --gold:#767260; --green:#1a3e32; --line:#e4ddcc; --err:#b03a3a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'SangBleu Republic', Georgia, serif; background:var(--bone); color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased; }
  header { background:#3a2f3c; padding:18px 24px; color:var(--bone); } header a { color:#c9b78f; font-size:13px; }
  main { max-width:980px; margin:0 auto; padding:0 20px 60px; }
  .top { position:sticky; top:0; z-index:5; background:var(--bone); padding:12px 0; display:flex; gap:10px; align-items:center; flex-wrap:wrap; border-bottom:1px solid var(--line); margin-bottom:16px; }
  .grow { flex:1; }
  .btn { font:inherit; font-size:14px; border:none; border-radius:6px; padding:10px 20px; cursor:pointer; background:var(--ink); color:var(--bone); }
  .btn:hover { background:#4a3d4d; } .btn:disabled { opacity:.4; cursor:default; }
  .btn.g { background:var(--green); } .btn.line { background:transparent; color:var(--soft); border:1px solid var(--line); } .btn.line:hover { background:var(--cream); }
  .btn.sm { padding:6px 12px; font-size:12px; } .btn.red { background:transparent; color:var(--err); border:1px solid var(--line); }
  .status { font-size:13px; color:var(--mute); } .status.ok { color:var(--green); } .status.bad { color:var(--err); }
  .card { background:var(--paper); border:1px solid var(--line); box-shadow:0 8px 28px rgba(58,47,60,.08); padding:22px 26px; margin-bottom:18px; }
  h2 { font-family:'SangBleu Sunrise', Georgia, serif; font-weight:400; font-size:21px; margin-bottom:4px; }
  .hint { font-size:13px; color:var(--mute); margin-bottom:14px; }
  label.l { display:block; font-size:12px; font-weight:500; margin:12px 0 5px; color:var(--soft); }
  input[type=text], select, textarea { width:100%; font-family:inherit; font-size:14px; color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:6px; padding:9px 11px; }
  textarea { resize:vertical; min-height:64px; line-height:1.5; } textarea.body { min-height:340px; font-size:13.5px; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(118,114,96,.15); }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:14px; } @media (max-width:760px){ .two{ grid-template-columns:1fr; } }
  .choice { display:grid; grid-template-columns:200px 1fr; gap:14px; padding:12px 0; border-top:1px solid var(--line); align-items:start; } .choice:first-of-type { border-top:none; }
  @media (max-width:760px){ .choice{ grid-template-columns:1fr; } }
  .choice b { font-weight:500; } .choice small { display:block; color:var(--mute); }
  .tabs { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .tab { font:inherit; font-size:14px; padding:9px 16px; border:1px solid var(--line); background:var(--paper); border-radius:8px; cursor:pointer; color:var(--soft); }
  .tab.on { background:var(--green); color:var(--bone); border-color:var(--green); }
  .split { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,420px); gap:20px; align-items:start; } @media (max-width:1000px){ .split{ grid-template-columns:1fr; } }
  .mailwin { background:#fff; border:1px solid #cfcfcf; border-radius:8px; overflow:hidden; font-family:Aptos, Calibri, 'Segoe UI', Arial, sans-serif; position:sticky; top:70px; }
  .mailwin-bar { background:#f3f2f1; border-bottom:1px solid #e1dfdd; padding:7px 14px; font-size:12px; color:#605e5c; }
  .mailwin-row { display:flex; gap:12px; padding:6px 16px; border-bottom:1px solid #f3f2f1; font-size:13px; } .mailwin-row b { width:50px; flex:none; font-weight:400; color:#605e5c; } .mailwin-row span { overflow-wrap:anywhere; }
  .mailwin-body { padding:14px 18px 20px; font-size:13px; line-height:1.5; white-space:pre-wrap; word-break:break-word; max-height:55vh; overflow:auto; }
  .miss { background:#f6e9b8; color:#7a5b00; border-radius:3px; padding:0 3px; }
  .tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; } .tools select { width:auto; max-width:230px; }
  .warn { background:#fbeaea; border-left:3px solid var(--err); padding:9px 12px; font-size:13px; margin:8px 0; color:#7a2a2a; }
  .note { background:var(--cream); border-left:3px solid var(--green); padding:9px 12px; font-size:13px; margin:8px 0; color:var(--soft); }
  details { margin-bottom:18px; } details > summary { cursor:pointer; font-family:'SangBleu Sunrise', Georgia, serif; font-size:19px; padding:14px 26px; background:var(--paper); border:1px solid var(--line); list-style:none; }
  details > summary::before { content:'▸  '; color:var(--gold); } details[open] > summary::before { content:'▾  '; }
  details > .in { background:var(--paper); border:1px solid var(--line); border-top:none; padding:6px 26px 20px; }
  .qrow { display:flex; gap:10px; align-items:center; padding:7px 0; border-top:1px solid var(--line); flex-wrap:wrap; } .qrow input[type=text] { flex:1; min-width:180px; }
  .qrow label { font-size:13px; white-space:nowrap; } .sech { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--gold); margin:16px 0 4px; }
  .vrow { display:flex; gap:12px; align-items:center; padding:8px 0; border-top:1px solid var(--line); flex-wrap:wrap; } .vrow small { color:var(--mute); }
  small { color:var(--mute); }
</style>
</head>
<body>
<header><a href="go-live-communication.html">← Back to the form</a></header>
<main id="app"><p style="padding:40px 0">Loading…</p></main>

<script src="go-live-engine.js"></script>
<script>
(function () {
  var G = window.GoLive;
  // One page, one link: this editor lives in the "Customize" tab of the form. Opened on its own, it forwards there.
  var embedded = window.self !== window.top;
  if (!embedded) { location.replace('go-live-communication.html#customize'); return; }
  document.querySelector('header').style.display = 'none';
  function tellParent() { try { window.parent.postMessage({ type: 'golive-config-saved' }, location.origin); } catch (e) {} }

  var API = 'https://link-portal-alpha.vercel.app/api/golive-config';
  var app = document.getElementById('app');
  var cfg = null, orig = '', dirty = false, emailKey = 'internal', keepOpen = {};
  var TYPES = [['text', 'Short answer'], ['textarea', 'Long answer'], ['select', 'Dropdown'], ['date', 'Date']];
  var SAMPLE = { submittedBy: 'Jenna Davidson', accountName: 'Example Company', region: 'Canada', accountLocation: 'Calgary, AB', contractedValue: '$80k USD', serviceLevel: 'Envoy', dk: '6475550100', launchType: 'Full', goLiveDate: '2026-10-21', handoverDate: '2026-10-21', implementationsLead: 'Kathy Boyken', csim: 'Jenna Davidson', csm: 'Mira Seagram', csmEmail: 'mira.seagram@kensingtoncorporate.com', csmPhone: '647-329-4045', leadAgent: 'Melissa Sawicki', bdm: 'Tammy Jule-Ganne', bdmEmail: 'tammy@kensingtoncorporate.com', signoffNames: 'Jenna, Kathy, Mira, Melissa', tmSignoff: 'Jenna & Kathy', contacts: 'Heidi Berger | Special Projects Lead | heidi@example.com | Travel Manager\nDyllan Lough | EA | dyllan@example.com | Travel Manager', selfRegLink: 'https://example.com/self-registration', adminTraining: '2026-10-14', generalTraining: '2026-10-21', contractExpiry: '2028-07-30', policyLink: 'https://example.com/policy' };

  function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function el(html) { var d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }
  function snap() { return JSON.stringify(cfg); }
  function markDirty() { dirty = snap() !== orig; var b = document.getElementById('saveBtn'); if (b) b.disabled = !dirty; if (dirty) status('You have unsaved changes.'); }
  window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  function status(msg, cls) { var s = document.getElementById('status'); if (s) { s.textContent = msg; s.className = 'status ' + (cls || ''); } }
  function post(body) { return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('Error ' + r.status)); return j; }); }); }
  function getJson(u) { return fetch(u).then(function (r) { return r.json(); }); }
  function allFields() { var a = []; cfg.sections.forEach(function (s) { s.fields.forEach(function (f) { a.push(f); }); }); return a; }
  function emailTexts(e) { return [e.subject, e.to, e.cc, e.body, e.attachments].join('\n'); }
  function usedIn(id) { var out = []; ['internal', 'welcome', 'tm'].forEach(function (k) { if (G.refs(emailTexts(cfg.emails[k])).indexOf(id) !== -1) out.push(cfg.emails[k].label); }); return out; }
  function uniqueLabel(label, self) { var base = label.trim() || 'New question', n = 2, l = base; while (allFields().some(function (f) { return f !== self && f.label.trim().toLowerCase() === l.toLowerCase(); })) l = base + ' ' + n++; return l; }
  function slug(label) {
    var w = String(label).replace(/[^A-Za-z0-9 ]+/g, ' ').trim().split(/\s+/).filter(Boolean);
    var id = w.map(function (x, i) { x = x.toLowerCase(); return i ? x.charAt(0).toUpperCase() + x.slice(1) : x; }).join('') || 'question';
    if (!/^[a-z]/.test(id)) id = 'q' + id; id = id.slice(0, 30);
    var ids = allFields().map(function (f) { return f.id; }), base = id, n = 2; while (ids.indexOf(id) !== -1) id = base + n++;
    return id;
  }

  function load() {
    getJson(API).then(function (c) { cfg = c; orig = snap(); dirty = false; render(); }).catch(function () { app.innerHTML = '<p style="padding:40px 0">Could not load the settings. Please refresh.</p>'; });
  }

  function render() {
    var scroll = window.scrollY; app.innerHTML = '';
    app.appendChild(el('<div class="top"><button class="btn g" id="saveBtn" disabled>Save changes</button><button class="btn line" id="discardBtn">Discard my edits</button><span id="status" class="status"></span><span class="grow"></span></div>'));
    cardChoices(); cardAdd(); cardEmails(); cardDates(); detailsQuestions(); detailsHistory();
    var sb = document.getElementById('saveBtn'); sb.disabled = !dirty; sb.onclick = save;
    document.getElementById('discardBtn').onclick = function () { if (!dirty || confirm('Throw away your unsaved edits?')) load(); };
    if (dirty) status('You have unsaved changes.');
    window.scrollTo(0, scroll);
  }

  // ---- 1. dropdown choices ----
  function cardChoices() {
    var card = el('<div class="card"><h2>Dropdown choices</h2><p class="hint">What people can pick from. One choice per line.</p></div>');
    var any = false;
    cfg.sections.forEach(function (s) { s.fields.forEach(function (f) {
      if (f.type !== 'select') return; any = true;
      var row = el('<div class="choice"><div><b>' + esc(f.label) + '</b><small>' + esc(s.title) + '</small></div><textarea rows="' + Math.max(2, (f.options || []).length) + '">' + esc((f.options || []).join('\n')) + '</textarea></div>');
      row.querySelector('textarea').oninput = function (e) { f.options = e.target.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean); markDirty(); };
      card.appendChild(row);
    }); });
    if (!any) card.appendChild(el('<p class="hint">There are no dropdowns yet. Add one below.</p>'));
    app.appendChild(card);
  }

  // ---- 2. add a question ----
  function cardAdd() {
    var secOpts = cfg.sections.map(function (s, i) { return '<option value="' + i + '">' + esc(s.title) + '</option>'; }).join('');
    var defSec = Math.max(0, cfg.sections.findIndex(function (s) { return /program/i.test(s.title); }));
    var card = el('<div class="card"><h2>Add a question</h2><p class="hint">It appears on the form straight away. Tick the emails that should mention the answer.</p>'
      + '<div class="two"><div><label class="l">Question</label><input type="text" id="aq" placeholder="e.g. Preferred hotel chain"></div><div><label class="l">Answer type</label><select id="at">' + TYPES.map(function (t) { return '<option value="' + t[0] + '">' + t[1] + '</option>'; }).join('') + '</select></div></div>'
      + '<div id="achoices" style="display:none"><label class="l">Choices (one per line)</label><textarea id="ac" rows="3" placeholder="Marriott&#10;Hilton&#10;Other"></textarea></div>'
      + '<div class="two"><div><label class="l">Where on the form</label><select id="as">' + secOpts + '</select></div><div><label class="l">Also mention it in</label><div style="padding-top:6px;font-size:14px">'
      + ['internal', 'welcome', 'tm'].map(function (k) { return '<label style="margin-right:14px;white-space:nowrap"><input type="checkbox" data-em="' + k + '"> ' + esc(cfg.emails[k].label) + '</label>'; }).join('') + '</div></div></div>'
      + '<p style="margin-top:14px"><button class="btn g" id="abtn">Add question</button></p></div>');
    card.querySelector('#as').value = String(defSec);
    card.querySelector('#at').onchange = function (e) { card.querySelector('#achoices').style.display = e.target.value === 'select' ? '' : 'none'; };
    card.querySelector('#abtn').onclick = function () {
      var label = uniqueLabel(card.querySelector('#aq').value); if (!card.querySelector('#aq').value.trim()) { alert('Type the question first.'); return; }
      var type = card.querySelector('#at').value, f = { id: slug(label), label: label, type: type };
      if (type === 'select') { f.options = card.querySelector('#ac').value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean); if (!f.options.length) { alert('Add at least one choice for the dropdown.'); return; } }
      cfg.sections[Number(card.querySelector('#as').value)].fields.push(f);
      card.querySelectorAll('[data-em]:checked').forEach(function (cb) {
        var e = cfg.emails[cb.dataset.em], line = f.label + ': {{' + f.id + '}}', at = e.body.lastIndexOf('\nThank you,');
        e.body = at === -1 ? e.body + '\n\n' + line : e.body.slice(0, at) + '\n' + line + '\n' + e.body.slice(at);
      });
      markDirty(); render(); status('Added “' + f.label + '”. Press Save changes to keep it.');
    };
    app.appendChild(card);
  }

  // ---- 3. the emails ----
  function previewValues() { var v = {}; allFields().forEach(function (f) { if (f.default) v[f.id] = f.default; }); Object.keys(SAMPLE).forEach(function (k) { v[k] = SAMPLE[k]; }); return v; }
  function insertAt(ta, text) { var s = ta.selectionStart, e = ta.selectionEnd; ta.value = ta.value.slice(0, s) + text + ta.value.slice(e); ta.focus(); ta.selectionStart = ta.selectionEnd = s + text.length; ta.dispatchEvent(new Event('input')); }

  function cardEmails() {
    var card = el('<div class="card"><h2>Email wording</h2><p class="hint">Write the email like normal. Pieces like <b>‹Account Name›</b> are filled in from the form. Use “Insert a field” to add one.</p><div class="tabs" id="etabs"></div><div class="split"><div id="eleft"></div><div id="eright"></div></div></div>');
    var tabs = card.querySelector('#etabs');
    ['internal', 'welcome', 'tm'].forEach(function (k) { var b = el('<button class="tab' + (emailKey === k ? ' on' : '') + '">' + esc(cfg.emails[k].label) + '</button>'); b.onclick = function () { emailKey = k; render(); }; tabs.appendChild(b); });
    var e = cfg.emails[emailKey], left = card.querySelector('#eleft'), right = card.querySelector('#eright');
    var fr = function (t) { return G.toFriendly(t || '', cfg); };
    left.innerHTML = '<label class="l" style="margin-top:0">Subject</label><input type="text" id="esub" value="' + esc(fr(e.subject)) + '">'
      + '<label class="l">Email</label><div class="tools" id="etools"></div><textarea class="body" id="ebody">' + esc(fr(e.body)) + '</textarea><div id="ewarn"></div>'
      + '<details id="emore" style="margin:12px 0 0"><summary style="font-size:14px;padding:9px 14px">Recipients and attachment reminder</summary><div class="in" style="padding:4px 14px 14px"><label class="l">To</label><textarea id="eto" rows="2">' + esc(fr(e.to)) + '</textarea><label class="l">CC</label><textarea id="ecc" rows="1">' + esc(fr(e.cc)) + '</textarea><label class="l">Remind to attach (shown after creating the email)</label><input type="text" id="eatt" value="' + esc(fr(e.attachments)) + '"></div></details>';
    right.innerHTML = '<div class="mailwin" id="pv"></div><p class="hint" style="margin-top:8px">Preview with an example account. Gold = a piece of information that is still blank.</p>';

    // tools: insert a field + "only show when…" paragraph
    var tools = left.querySelector('#etools'), ta = left.querySelector('#ebody');
    var fieldSel = el('<select><option value="">Insert a field…</option>' + cfg.sections.map(function (s) { return '<optgroup label="' + esc(s.title) + '">' + s.fields.map(function (f) { return '<option value="' + esc(f.label) + '">' + esc(f.label) + '</option>'; }).join('') + '</optgroup>'; }).join('') + '</select>');
    fieldSel.onchange = function () { if (fieldSel.value) { insertAt(ta, '‹' + fieldSel.value + '›'); fieldSel.value = ''; } };
    tools.appendChild(fieldSel);
    var dd = allFields().filter(function (f) { return f.type === 'select' && f.options && f.options.length; });
    if (dd.length) {
      var cb = el('<button class="btn line sm">Add a paragraph that only shows when…</button>');
      var box = el('<span style="display:none;gap:6px;align-items:center;flex-wrap:wrap"></span>'); box.style.display = 'none';
      var fsel = el('<select>' + dd.map(function (f) { return '<option value="' + esc(f.label) + '">' + esc(f.label) + '</option>'; }).join('') + '</select>');
      var op = el('<select><option value="is">is</option><option value="is not">is not</option></select>'), vsel = el('<select></select>');
      var fillVals = function () { var f = dd.filter(function (x) { return x.label === fsel.value; })[0]; vsel.innerHTML = (f ? f.options : []).map(function (o) { return '<option>' + esc(o) + '</option>'; }).join(''); };
      fsel.onchange = fillVals; fillVals();
      var go = el('<button class="btn g sm">Insert</button>');
      go.onclick = function () { insertAt(ta, '\n‹IF ' + fsel.value + ' ' + op.value + ' ' + vsel.value + '›\nWrite the paragraph here.\n‹END IF›\n'); box.style.display = 'none'; };
      box.appendChild(fsel); box.appendChild(op); box.appendChild(vsel); box.appendChild(go);
      cb.onclick = function () { box.style.display = box.style.display === 'none' ? 'inline-flex' : 'none'; };
      tools.appendChild(cb); tools.appendChild(box);
    }
    tools.appendChild(el('<button class="btn line sm">Add a heading</button>')).onclick = function () { insertAt(ta, '\n## Heading text\n'); };

    var bind = function (id, prop) { var node = left.querySelector(id); node.oninput = function () { e[prop] = G.toRaw(node.value, cfg); markDirty(); paint(); }; };
    bind('#esub', 'subject'); bind('#ebody', 'body'); bind('#eto', 'to'); bind('#ecc', 'cc'); bind('#eatt', 'attachments');
    if (keepOpen.more) left.querySelector('#emore').open = true;
    left.querySelector('#emore').ontoggle = function (ev) { keepOpen.more = ev.target.open; };

    function paint() {
      var r = G.renderEmail(e, previewValues(), cfg);
      var hi = function (t) { return esc(t).replace(/\[[^\]\n]{1,80}\]/g, function (m) { return '<span class="miss">' + m + '</span>'; }); };
      right.querySelector('#pv').innerHTML = '<div class="mailwin-bar">Preview</div><div class="mailwin-row"><b>To</b><span>' + (r.to.length ? esc(r.to.join('; ')) : '<span class="miss">[recipients]</span>') + '</span></div>'
        + (r.cc.length ? '<div class="mailwin-row"><b>Cc</b><span>' + esc(r.cc.join('; ')) + '</span></div>' : '') + '<div class="mailwin-row"><b>Subject</b><span>' + hi(r.subject) + '</span></div><div class="mailwin-body">' + hi(r.body) + '</div>';
      var bad = G.unrecognised([left.querySelector('#esub').value, left.querySelector('#ebody').value, left.querySelector('#eto').value, left.querySelector('#ecc').value, left.querySelector('#eatt').value].join('\n'), cfg);
      left.querySelector('#ewarn').innerHTML = bad.length ? '<div class="warn">These pieces were not recognised, so they would appear as typed: <b>' + esc(bad.join('  ')) + '</b>. Use “Insert a field” to add them correctly.</div>' : '';
    }
    paint(); app.appendChild(card);
  }

  // ---- 4. dates ----
  function cardDates() {
    var PRESETS = [['{weekday}, {month} {dayth}, {year}', 'Wednesday, October 21st, 2026'], ['{weekday} {month} {dayth}, {year}', 'Wednesday October 21st, 2026'], ['{month} {dayth}, {year}', 'October 21st, 2026'], ['{month} {day}, {year}', 'October 21, 2026'], ['{mon} {day}, {year}', 'Oct 21, 2026'], ['{day} {month} {year}', '21 October 2026'], ['{year}-{mm}-{dd}', '2026-10-21']];
    var cur = cfg.dateFormat || G.DEFAULT_DATE_FORMAT, isPreset = PRESETS.some(function (p) { return p[0] === cur; });
    var card = el('<div class="card"><h2>How dates are written</h2><p class="hint">Used for every date in the emails.</p><select id="dsel">' + PRESETS.map(function (p) { return '<option value="' + esc(p[0]) + '">' + esc(p[1]) + '</option>'; }).join('') + '<option value="">Something else…</option></select>'
      + '<div id="dcust" style="display:' + (isPreset ? 'none' : 'block') + '"><label class="l">Your own style</label><input type="text" id="dfmt" value="' + esc(cur) + '"><small>Pieces: {weekday} Wednesday · {month} October · {mon} Oct · {dayth} 21st · {day} 21 · {dd} 21 (two digits) · {mm} 10 · {year} 2026 · {yy} 26</small></div>'
      + '<p style="margin-top:10px;font-size:14px">Example: <b id="dex">' + esc(G.fmtDate('2026-10-21', cur)) + '</b></p></div>');
    var sel = card.querySelector('#dsel'), inp = card.querySelector('#dfmt'); sel.value = isPreset ? cur : '';
    var apply = function (f) { cfg.dateFormat = f || G.DEFAULT_DATE_FORMAT; card.querySelector('#dex').textContent = G.fmtDate('2026-10-21', cfg.dateFormat); markDirty(); };
    sel.onchange = function () { if (sel.value) { card.querySelector('#dcust').style.display = 'none'; inp.value = sel.value; apply(sel.value); } else card.querySelector('#dcust').style.display = 'block'; };
    inp.oninput = function () { apply(inp.value); };
    app.appendChild(card);
  }

  // ---- 5. rename / required / remove ----
  function detailsQuestions() {
    var d = el('<details><summary>All questions: rename, required, remove</summary><div class="in"></div></details>'), box = d.querySelector('.in');
    d.open = !!keepOpen.q; d.ontoggle = function () { keepOpen.q = d.open; };
    cfg.sections.forEach(function (s) {
      box.appendChild(el('<div class="sech">' + esc(s.title) + '</div>'));
      s.fields.forEach(function (f, fi) {
        var row = el('<div class="qrow"><input type="text" value="' + esc(f.label) + '"><label><input type="checkbox"' + (f.required ? ' checked' : '') + '> Required</label><button class="btn red sm">Remove</button></div>');
        row.querySelector('input[type=text]').onchange = function (e) { f.label = uniqueLabel(e.target.value, f); markDirty(); render(); };
        row.querySelector('input[type=checkbox]').onchange = function (e) { f.required = e.target.checked; markDirty(); };
        row.querySelector('button').onclick = function () {
          var u = usedIn(f.id); if (!confirm('Remove “' + f.label + '”?' + (u.length ? '\n\nIt is used in: ' + u.join(', ') + '. Those emails will show it as blank until you edit them.' : ''))) return;
          s.fields.splice(fi, 1); markDirty(); render();
        };
        box.appendChild(row);
      });
    });
    app.appendChild(d);
  }

  // ---- 6. history ----
  function detailsHistory() {
    var d = el('<details><summary>Undo and history</summary><div class="in"><div id="vl"><small>Loading…</small></div><p style="margin-top:14px"><button class="btn red sm" id="resetBtn">Start over with the original settings</button> <small>(not kept until you press Save changes)</small></p></div></details>');
    d.open = !!keepOpen.h; d.ontoggle = function () { keepOpen.h = d.open; };
    getJson(API + '?versions=1').then(function (j) {
      var vl = d.querySelector('#vl'); vl.innerHTML = '';
      // "Undo my last save" = the most recent earlier version whose contents really differ from what is live now
      // (the history list can lag a moment, so we compare contents instead of trusting its order).
      var ub = el('<p style="margin-bottom:10px"><button class="btn g sm">Undo my last save</button> <small>Goes back to the most recent different version.</small></p>');
      ub.querySelector('button').onclick = function () {
        status('Looking for the previous version…');
        getJson(API).then(function (cur) {
          var curS = JSON.stringify(cur), list = (j.versions || []).slice(), tried = 0;
          var nextOne = function () {
            if (!list.length || tried++ > 8) return Promise.reject(new Error('There is no earlier version to go back to.'));
            var v = list.shift();
            return getJson(API + '?version=' + v.sha).then(function (c) { return JSON.stringify(c) === curS ? nextOne() : v; });
          };
          return nextOne();
        }).then(function (v) {
          if (!confirm('Go back to “' + v.message + '” (' + new Date(v.date).toLocaleString() + ')? You can undo this too.')) { status(''); return; }
          return post({ action: 'restore', sha: v.sha }).then(function () { tellParent(); load(); status('✓ Went back one version.', 'ok'); });
        }).catch(function (er) { status(er.message, 'bad'); });
      };
      vl.appendChild(ub);
      (j.versions || []).forEach(function (v, i) {
        var row = el('<div class="vrow"><span class="grow"><b>' + esc(v.message) + '</b><br><small>' + new Date(v.date).toLocaleString() + (i === 0 ? ' · current' : '') + '</small></span></div>');
        if (i > 0) { var b = el('<button class="btn line sm">Go back to this</button>'); b.onclick = function () { if (!confirm('Go back to this version? You can undo this too.')) return; post({ action: 'restore', sha: v.sha }).then(function () { tellParent(); load(); status('✓ Restored.', 'ok'); }).catch(function (er) { status(er.message, 'bad'); }); }; row.appendChild(b); }
        vl.appendChild(row);
      });
    }).catch(function () { d.querySelector('#vl').textContent = 'Could not load the history.'; });
    d.querySelector('#resetBtn').onclick = function () { if (!confirm('Replace everything here with the original fields and emails? (Nothing is saved until you press Save changes.)')) return; getJson('go-live-default-config.json').then(function (c) { cfg = c; markDirty(); render(); }); };
    app.appendChild(d);
  }

  function save() {
    var probs = [];
    ['internal', 'welcome', 'tm'].forEach(function (k) {
      var e = cfg.emails[k], bad = G.unknownRefs(emailTexts(e), cfg), un = G.unrecognised(emailTexts(e), cfg);
      if (un.length) probs.push('“' + e.label + '” has pieces that were not recognised: ' + un.join(' '));
      if (bad.length) probs.push('“' + e.label + '” uses questions that no longer exist: ' + bad.join(', '));
    });
    cfg.sections.forEach(function (s) { s.fields.forEach(function (f) { if (f.type === 'select' && (!f.options || !f.options.length)) probs.push('The dropdown “' + f.label + '” has no choices.'); }); });
    if (probs.length && !confirm('Please check:\n\n' + probs.join('\n') + '\n\nSave anyway?')) return;
    status('Saving…');
    post({ action: 'save', config: cfg, message: 'Updated settings' }).then(function () { orig = snap(); dirty = false; document.getElementById('saveBtn').disabled = true; status('✓ Saved. The form uses it straight away.', 'ok'); tellParent(); })
      .catch(function (er) { status(er.message, 'bad'); });
  }

  load();
})();
</script>
</body>
</html>
